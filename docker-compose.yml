name: ouroboros

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ouroboros-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${SQLSERVER_SA_PASSWORD}
    ports:
      - "${SQLSERVER_PORT}:1433"
    volumes:
      - ouroboros-sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  # SQL Server nao tem /docker-entrypoint-initdb.d: este servico de uso unico cria o banco e os dois papeis do auth-service
  # (auth_migrator, dono do schema, e auth_service, so DML).
  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ouroboros-sqlserver-init
    restart: "no"
    environment:
      MSSQL_SA_PASSWORD: ${SQLSERVER_SA_PASSWORD}
      AUTH_DB_NAME: ${AUTH_DB_NAME}
      AUTH_MIGRATOR_USER: ${AUTH_MIGRATOR_USER}
      AUTH_MIGRATOR_PASSWORD: ${AUTH_MIGRATOR_PASSWORD}
      AUTH_DB_USER: ${AUTH_DB_USER}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
    volumes:
      - ./docker/sqlserver/init:/init:ro
    entrypoint: ["/bin/bash", "/init/01-create-auth-db.sh"]
    depends_on:
      sqlserver:
        condition: service_healthy

  seq:
    image: datalust/seq:latest
    container_name: ouroboros-seq
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_ADMINPASSWORD: ${SEQ_ADMIN_PASSWORD}
    ports:
      - "${SEQ_UI_PORT}:80"
      - "${SEQ_INGESTION_PORT}:5341"
    volumes:
      - ouroboros-seq-data:/data

  # A API nao roda DDL: este servico de uso unico aplica as migrations (mesma imagem, comando "migrate") com o papel
  # auth_migrator, dono do schema. O auth-service so sobe depois que ele termina com sucesso.
  auth-migrate:
    build:
      context: .
      dockerfile: auth-service/Auth.Api/Dockerfile
    image: ouroboros-auth-service
    container_name: ouroboros-auth-migrate
    restart: "no"
    command: ["migrate"]
    environment:
      ConnectionStrings__Migration: Server=sqlserver,1433;Database=${AUTH_DB_NAME};User Id=${AUTH_MIGRATOR_USER};Password=${AUTH_MIGRATOR_PASSWORD};Encrypt=True;TrustServerCertificate=True
    depends_on:
      sqlserver-init:
        condition: service_completed_successfully

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Auth.Api/Dockerfile
    image: ouroboros-auth-service
    container_name: ouroboros-auth-service
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Server=sqlserver,1433;Database=${AUTH_DB_NAME};User Id=${AUTH_DB_USER};Password=${AUTH_DB_PASSWORD};Encrypt=True;TrustServerCertificate=True
      Seq__ServerUrl: http://seq:5341
      Jwt__SigningKey: ${AUTH_JWT_SIGNING_KEY}
    ports:
      - "8082:8082"
    depends_on:
      auth-migrate:
        condition: service_completed_successfully
      seq:
        condition: service_started

volumes:
  ouroboros-sqlserver-data:
    name: ouroboros-sqlserver-data
  ouroboros-seq-data:
    name: ouroboros-seq-data
