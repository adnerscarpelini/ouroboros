name: ouroboros

services:
  postgres:
    image: postgres:16-alpine
    container_name: ouroboros-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_DB: postgres
      AUTH_DB_NAME: ${AUTH_DB_NAME}
      AUTH_DB_USER: ${AUTH_DB_USER}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - ouroboros-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 5

  seq:
    image: datalust/seq:latest
    container_name: ouroboros-seq
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_ADMINPASSWORD: ${SEQ_ADMIN_PASSWORD}
    ports:
      - "${SEQ_UI_PORT}:80"
      - "${SEQ_INGESTION_PORT}:5341"
    volumes:
      - ouroboros-seq-data:/data

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Auth.Api/Dockerfile
    container_name: ouroboros-auth-service
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=${AUTH_DB_NAME};Username=${AUTH_DB_USER};Password=${AUTH_DB_PASSWORD}
      Seq__ServerUrl: http://seq:5341
      Jwt__SigningKey: ${AUTH_JWT_SIGNING_KEY}
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      seq:
        condition: service_started

volumes:
  ouroboros-postgres-data:
    name: ouroboros-postgres-data
  ouroboros-seq-data:
    name: ouroboros-seq-data
