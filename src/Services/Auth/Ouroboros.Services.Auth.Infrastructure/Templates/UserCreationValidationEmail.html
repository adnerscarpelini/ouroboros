<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>Confirme seu cadastro</title>
<style>
	body { margin: 0; padding: 0; background-color: #0b0f0d; font-family: 'Segoe UI', Arial, sans-serif; }
	.container { max-width: 480px; margin: 40px auto; background-color: #121815; border-radius: 12px; overflow: hidden; border: 1px solid #1f2b25; }
	.header { background-color: #0b0f0d; padding: 32px; text-align: center; border-bottom: 1px solid #1f2b25; }
	.header h1 { color: #ff6200; margin: 0; font-size: 22px; letter-spacing: 2px; }
	.content { padding: 32px; color: #e5e7eb; }
	.content p { line-height: 1.6; font-size: 15px; margin: 0 0 16px; }
	.button-row { text-align: center; margin: 24px 0; }
	.button { display: inline-block; padding: 14px 32px; background-color: #ff6200; color: #0b0f0d !important; text-decoration: none; font-weight: bold; border-radius: 8px; font-size: 15px; }
	.muted { color: #6b7280; font-size: 13px; }
	.footer { padding: 24px 32px; color: #6b7280; font-size: 12px; text-align: center; border-top: 1px solid #1f2b25; }
</style>
</head>
<body>
	<div class="container">
		<div class="header">
			<h1>OUROBOROS</h1>
		</div>
		<div class="content">
			<p>Olá, {{FullName}}!</p>
			<p>Confirme seu cadastro clicando no botão abaixo:</p>
			<div class="button-row">
				<a class="button" href="{{ConfirmationUrl}}">Confirmar cadastro</a>
			</div>
			<p class="muted">Se o botão não funcionar, copie e cole este link no navegador:<br />{{ConfirmationUrl}}</p>
			<p class="muted">Se você não fez esse cadastro, pode ignorar este e-mail.</p>
		</div>
		<div class="footer">Ouroboros</div>
	</div>
</body>
</html>
